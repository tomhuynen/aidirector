      title: Settings
      icon: Settings2
      items:
        - route: admin.system.database
          title: Database
          icon: Database
          permission: admin.database.view
        - route: admin.system.server
          title: Server
          icon: HardDrive
          permission: admin.server.view
        - route: log-viewer.index
          title: Logs
          icon: FileText
          permission: admin.logs.view
