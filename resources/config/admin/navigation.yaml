- title: Application
  items:
    - route: admin.dashboard.index
      title: Dashboard
      icon: Gauge
    - route: admin.accounts.index
      permission: admin.accounts.view
      title: Accounts
      icon: User
    - route: admin.tenants.index
      permission: admin.tenants.view
      title: Tenants
      icon: Building
    - route: admin.activities.index
